services:
  postgres:
    image: postgres:16-alpine
    container_name: lakshyaos-postgres
    environment:
      POSTGRES_DB: lakshyaos
      POSTGRES_USER: lakshyaos
      POSTGRES_PASSWORD: lakshyaos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakshyaos -d lakshyaos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
